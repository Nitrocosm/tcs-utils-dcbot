[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Keep the baseline light for now: pyflakes (F) + pycodestyle errors/warnings (E, W).
# Stricter rule sets (import sorting, bugbear, etc.) can be enabled in a later phase
# once the codebase is cleaned up enough not to drown in warnings.
select = ["E", "F", "W"]
# Discord message templates are intentionally long; the codebase has historical
# one-liner `if x: y` and semicolon-chained statements that we don't want CI to
# fight us over today.
ignore = ["E501", "E701", "E702"]

[tool.ruff.format]
quote-style = "single"
